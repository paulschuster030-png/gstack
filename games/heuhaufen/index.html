<title>Nadel im Heuhaufen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700&display=swap">
<style>
  /* Layout: one-screen game. Sky HUD on top, haystack canvas fills the rest, overlay cards for start/win/lose. */
  :root {
    --sky: #8fd3f4;
    --sky-deep: #4fa8d8;
    --hay: #f2c14e;
    --hay-dark: #b9822a;
    --ink: #3a2412;
    --barn: #c8442f;
    --paper: #fff7e3;
    --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .app { height: 100%; display: flex; flex-direction: column; }
  .hud {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: linear-gradient(var(--sky-deep), var(--sky));
  }
  .farmer { width: 54px; height: 54px; flex: none; transition: transform .2s; }
  .farmer.bounce { animation: bounce .5s; }
  .farmer.shake { animation: shake .4s; }
  @keyframes bounce { 40% { transform: translateY(-10px) scale(1.08); } }
  @keyframes shake { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  .speech {
    flex: 1; min-width: 0;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
    padding: 4px 10px; font-weight: 700; font-size: 15px; line-height: 1.25;
    position: relative;
  }
  .speech::before {
    content: ""; position: absolute; left: -11px; top: 50%; margin-top: -7px;
    border: 7px solid transparent; border-right: 9px solid var(--ink); border-left: 0;
  }
  .stats { display: flex; gap: 8px; flex: none; }
  .chip {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 12px;
    padding: 2px 10px; text-align: center; min-width: 54px;
    font-variant-numeric: tabular-nums;
  }
  .chip b { display: block; font-family: var(--display); font-size: 22px; line-height: 1.05; font-weight: 400; }
  .chip span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .chip.low b { color: var(--barn); }
  .stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hint-btn {
    position: absolute; right: 16px; bottom: 16px;
    font-family: var(--display); font-size: 18px; color: var(--paper);
    background: var(--barn); border: 3px solid var(--ink); border-radius: 14px;
    padding: 6px 14px; box-shadow: 0 4px 0 var(--ink); cursor: pointer;
  }
  .hint-btn:disabled { opacity: .45; cursor: default; }
  .hint-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(58, 36, 18, .35); padding: 16px;
  }
  .card {
    background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
    padding: 22px 22px 20px; max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 8px 0 var(--ink);
    display: grid; gap: 10px; justify-items: center;
  }
  .card h1 {
    font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1;
    margin: 0; color: var(--barn); text-wrap: balance;
    -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill;
  }
  .card p { margin: 0; font-size: 16px; line-height: 1.4; }
  .card .big { width: 110px; height: 110px; }
  .go {
    font-family: var(--display); font-size: 24px; color: var(--ink);
    background: var(--hay); border: 3px solid var(--ink); border-radius: 16px;
    padding: 8px 28px; box-shadow: 0 5px 0 var(--ink); cursor: pointer; margin-top: 4px;
  }
  .go:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--sky-deep); outline-offset: 3px; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 13px; font-weight: 700; }
  @media (max-width: 420px) {
    .speech { font-size: 13px; }
    .chip { min-width: 44px; padding: 2px 6px; }
    .chip b { font-size: 18px; }
    .farmer { width: 44px; height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .farmer.bounce, .farmer.shake { animation: none; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="farmer" viewBox="0 0 100 100">
      <!-- hat brim + crown -->
      <ellipse cx="50" cy="36" rx="46" ry="11" fill="#f2c14e" stroke="#3a2412" stroke-width="4"/>
      <!-- face -->
      <circle cx="50" cy="60" r="30" fill="#ffd2a8" stroke="#3a2412" stroke-width="4"/>
      <path d="M24 36 Q50 4 76 36 Z" fill="#f2c14e" stroke="#3a2412" stroke-width="4" stroke-linejoin="round"/>
      <path d="M27 31 H73" stroke="#c8442f" stroke-width="6"/>
      <!-- cheeks -->
      <circle cx="32" cy="68" r="5" fill="#f59a8b"/>
      <circle cx="68" cy="68" r="5" fill="#f59a8b"/>
      <!-- straw in mouth -->
      <path class="straw" d="M58 76 L84 70" stroke="#b9822a" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <g class="eyes-happy">

      <ellipse cx="50" cy="36" rx="46" ry="11" fill="#f2c14e" stroke="#3a2412" stroke-width="4"/>
      <circle cx="50" cy="60" r="30" fill="#ffd2a8" stroke="#3a2412" stroke-width="4"/>
      <path d="M24 36 Q50 4 76 36 Z" fill="#f2c14e" stroke="#3a2412" stroke-width="4" stroke-linejoin="round"/>
      <path d="M27 31 H73" stroke="#c8442f" stroke-width="6"/>
      <path d="M34 54 L44 58 M66 54 L56 58" stroke="#3a2412" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 76 Q50 68 60 76" fill="none" stroke="#3a2412" stroke-width="4" stroke-linecap="round"/>
      <path d="M71 50 q4 8 0 10 q-4 -2 0 -10" fill="#8fd3f4" stroke="#3a2412" stroke-width="2"/>

    <symbol id="farmer-wow" viewBox="0 0 100 100">
      <ellipse cx="50" cy="36" rx="46" ry="11" fill="#f2c14e" stroke="#3a2412" stroke-width="4"/>
      <circle cx="50" cy="60" r="30" fill="#ffd2a8" stroke="#3a2412" stroke-width="4"/>
      <path d="M24 36 Q50 4 76 36 Z" fill="#f2c14e" stroke="#3a2412" stroke-width="4" stroke-linejoin="round"/>
      <path d="M27 31 H73" stroke="#c8442f" stroke-width="6"/>
      <circle cx="32" cy="68" r="6" fill="#f59a8b"/>
      <circle cx="68" cy="68" r="6" fill="#f59a8b"/>
      <path d="M35 57 Q40 50 45 57 M55 57 Q60 50 65 57" fill="none" stroke="#3a2412" stroke-width="4" stroke-linecap="round"/>
      <path d="M38 68 Q50 86 62 68 Z" fill="#7a2a1c" stroke="#3a2412" stroke-width="4" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <header class="hud">
    <svg class="farmer" id="farmer"><use href="#farmer"/></svg>
    <div class="speech" id="speech">Irgendwo da drin steckt meine Nadel!</div>
    <div class="stats">
      <div class="chip"><b id="level">1</b><span>Level</span></div>
      <div class="chip" id="timeChip"><b id="time">30</b><span>Sek.</span></div>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="game" aria-label="Heuhaufen. Wische das Heu beiseite und tippe auf die Nadel."></canvas>
    <button class="hint-btn" id="hint" type="button" disabled>Magnet 🧲 1</button>
    <div class="overlay" id="overlay">
      <div class="card" id="card">
        <svg class="big"><use href="#farmer"/></svg>
        <h1>Nadel im Heuhaufen</h1>
        <p>Bauer Hinnerk hat seine Nadel verloren. <b>Wische</b> das Heu beiseite und <b>tippe</b> auf die Nadel, bevor die Zeit abläuft.</p>
        <div class="legend"><span>✔ silberne Nadel</span><span>✘ rostige Nägel: −3 Sek.</span></div>
        <button class="go" id="start" type="button">Los geht's!</button>
        <p id="bestLine" hidden></p>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const card = document.getElementById('card');
  const speechEl = document.getElementById('speech');
  const farmerEl = document.getElementById('farmer');
  const levelEl = document.getElementById('level');
  const timeEl = document.getElementById('time');
  const timeChip = document.getElementById('timeChip');
  const hintBtn = document.getElementById('hint');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const HAY = ['#f2c14e', '#e8b23d', '#f7d36b', '#dba53a', '#f0c860', '#c9952f'];
  const PUSH_RADIUS = 46;
  const TAP_RADIUS = 26;

  let W = 0, H = 0, dpr = 1;
  let straws = [], needle = null, nails = [], sparkles = [];
  let level = 1, timeLeft = 30, playing = false, hints = 1, magnetUntil = 0;
  let best = 0;
  try { best = Number(localStorage.getItem('heuhaufen-best')) || 0; } catch (e) { best = 0; }

  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const rand = (a, b) => a + Math.random() * (b - a);

  // The pile is an ellipse sitting on the ground line.
  function pile() {
    const groundY = H - 28;
    const rx = Math.min(W * 0.46, 420);
    const ry = Math.min(H * 0.42, 300);
    return { cx: W / 2, cy: groundY - ry * 0.78, rx, ry, groundY };
  }
  function pointInPile(p, shrink = 1) {
    for (;;) {
      const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * shrink;
      const x = p.cx + Math.cos(a) * p.rx * d;
      const y = p.cy + Math.sin(a) * p.ry * d;
      if (y < p.groundY - 6) return { x, y };
    }
  }

  function setupLevel() {
    const p = pile();
    const area = p.rx * p.ry;
    const density = 0.010 + level * 0.0022;
    const count = Math.min(1400, Math.round(area * density));
    const pos = pointInPile(p, 0.7);
    needle = { x: pos.x, y: pos.y, a: rand(-0.8, 0.8), len: 34, found: false };
    nails = [];
    const nailCount = Math.min(10, level - 1 + Math.floor(level / 2));
    for (let i = 0; i < nailCount; i++) {
      const q = pointInPile(p, 0.85);
      nails.push({ x: q.x, y: q.y, a: rand(0, Math.PI * 2), len: rand(22, 28) });
    }
    straws = [];
    for (let i = 0; i < count; i++) {
      const q = pointInPile(p, 1);
      straws.push({
        x: q.x, y: q.y, a: rand(0, Math.PI), len: rand(26, 54),
        w: rand(3, 5), c: HAY[(Math.random() * HAY.length) | 0],
        vx: 0, vy: 0, va: 0
      });
    }
    // Make sure the needle is buried: put extra straws right over it.
    for (let i = 0; i < 26; i++) {
      straws.push({
        x: needle.x + rand(-22, 22), y: needle.y + rand(-14, 14), a: rand(0, Math.PI),
        len: rand(30, 50), w: rand(3, 5), c: HAY[(Math.random() * HAY.length) | 0],
        vx: 0, vy: 0, va: 0
      });
    }
    timeLeft = Math.max(15, 32 - level);
    hints = 1;
    magnetUntil = 0;
    sparkles = [];
    levelEl.textContent = level;
    updateTime();
    updateHint();
  }

  // ---------- drawing ----------
  function drawBackground(t) {
    const p = pile();
    // hills
    ctx.fillStyle = '#7cc46b';
    ctx.beginPath();
    ctx.moveTo(0, p.groundY);
    ctx.quadraticCurveTo(W * 0.25, p.groundY - 60, W * 0.5, p.groundY - 20);
    ctx.quadraticCurveTo(W * 0.78, p.groundY - 70, W, p.groundY - 10);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5aa84e';
    ctx.fillRect(0, p.groundY, W, H - p.groundY);
    ctx.strokeStyle = '#3a2412'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, p.groundY); ctx.lineTo(W, p.groundY); ctx.stroke();
    // clouds drift
    ctx.fillStyle = '#ffffff';
    const drift = reduceMotion ? 0 : (t / 60) % (W + 200);
    [[0.15, 0.12, 1], [0.62, 0.07, 0.8], [0.9, 0.2, 0.6]].forEach(([fx, fy, s]) => {
      const x = ((fx * W + drift * s) % (W + 200)) - 100;
      const y = fy * H + 10;
      ctx.beginPath();
      ctx.arc(x, y, 18 * s + 8, 0, 7);
      ctx.arc(x + 22 * s + 6, y - 8, 22 * s + 8, 0, 7);
      ctx.arc(x + 48 * s + 10, y, 16 * s + 8, 0, 7);
      ctx.fill();
    });
    // pile shadow / base mound
    ctx.fillStyle = '#c9952f';
    ctx.beginPath();
    ctx.ellipse(p.cx, p.groundY, p.rx * 1.02, 16, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function stick(x, y, a, len, w, color, outline) {
    const dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = outline; ctx.lineWidth = w + 3;
    ctx.beginPath(); ctx.moveTo(x - dx, y - dy); ctx.lineTo(x + dx, y + dy); ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x - dx, y - dy); ctx.lineTo(x + dx, y + dy); ctx.stroke();
  }

  function drawNeedle(n, t) {
    ctx.save();
    ctx.translate(n.x, n.y); ctx.rotate(n.a);
    const L = n.len;
    // body
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#3a2412'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2, 0); ctx.stroke();
    const g = ctx.createLinearGradient(0, -3, 0, 3);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#9aa7b4');
    ctx.strokeStyle = g; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2, 0); ctx.stroke();
    // eye
    ctx.fillStyle = '#3a2412';
    ctx.beginPath(); ctx.ellipse(-L / 2 + 5, 0, 3, 1.4, 0, 0, 7); ctx.fill();
    // red thread
    ctx.strokeStyle = '#c8442f'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-L / 2 + 5, 0);
    ctx.bezierCurveTo(-L / 2 - 8, -10, -L / 2 - 12, 10, -L / 2 - 20, 4); ctx.stroke();
    ctx.restore();
    // glint
    const pulse = reduceMotion ? 0.6 : 0.5 + 0.5 * Math.sin(t / 220);
    star(n.x + Math.cos(n.a) * L * 0.3, n.y + Math.sin(n.a) * L * 0.3, 4 + pulse * 3, `rgba(255,255,255,${0.5 + pulse * 0.5})`);
  }

  function drawNail(n) {
    ctx.save();
    ctx.translate(n.x, n.y); ctx.rotate(n.a);
    const L = n.len;
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#3a2412'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2 - 3, 0); ctx.stroke();
    ctx.strokeStyle = '#a0603a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2 - 3, 0); ctx.stroke();
    // tip
    ctx.fillStyle = '#a0603a'; ctx.strokeStyle = '#3a2412'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(L / 2 - 4, -3); ctx.lineTo(L / 2 + 3, 0); ctx.lineTo(L / 2 - 4, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    // head
    ctx.fillStyle = '#7a4a2a';
    ctx.beginPath(); ctx.roundRect(-L / 2 - 3, -6, 4, 12, 1.5); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function star(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rr = i % 2 ? r * 0.3 : r;
      const a = i * Math.PI / 4;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    drawBackground(t);
    nails.forEach(drawNail);
    if (needle) drawNeedle(needle, t);
    for (const s of straws) stick(s.x, s.y, s.a, s.len, s.w, s.c, '#8a5a1c');
    // magnet hint: warm ring that pulls toward the needle
    if (needle && performance.now() < magnetUntil) {
      const k = (magnetUntil - performance.now()) / 2500;
      ctx.strokeStyle = `rgba(200,68,47,${0.3 + 0.6 * k})`;
      ctx.lineWidth = 5;
      ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.arc(needle.x + 14, needle.y - 10, 60 + 40 * (1 - k), 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
    for (const sp of sparkles) {
      star(sp.x, sp.y, sp.r, `rgba(255,247,227,${sp.life})`);
    }
  }

  // ---------- physics ----------
  function step(dt) {
    const p = pile();
    for (const s of straws) {
      if (s.vx || s.vy || s.va) {
        s.x += s.vx * dt; s.y += s.vy * dt; s.a += s.va * dt;
        const f = Math.pow(0.004, dt);
        s.vx *= f; s.vy *= f; s.va *= f;
        if (Math.abs(s.vx) + Math.abs(s.vy) + Math.abs(s.va) < 0.5) { s.vx = s.vy = s.va = 0; }
        if (s.y > p.groundY - 4) { s.y = p.groundY - 4; s.vy = 0; }
      }
    }
    for (const sp of sparkles) { sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vy += 300 * dt; sp.life -= dt * 1.2; }
    sparkles = sparkles.filter(sp => sp.life > 0);
  }

  function sweep(x, y, dx, dy) {
    const len = Math.hypot(dx, dy) || 1;
    const R2 = PUSH_RADIUS * PUSH_RADIUS;
    for (const s of straws) {
      const ox = s.x - x, oy = s.y - y;
      const d2 = ox * ox + oy * oy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) || 1;
        const strength = 1 - d / PUSH_RADIUS;
        s.vx += (dx / len * 520 + ox / d * 380) * strength;
        s.vy += (dy / len * 520 + oy / d * 380) * strength;
        s.va += rand(-8, 8) * strength;
      }
    }
  }

  // How much hay still lies over a point (straws whose segment passes near it).
  function coverAt(x, y) {
    let n = 0;
    for (const s of straws) {
      const dx = Math.cos(s.a) * s.len / 2, dy = Math.sin(s.a) * s.len / 2;
      const ax = s.x - dx, ay = s.y - dy, bx = s.x + dx, by = s.y + dy;
      const abx = bx - ax, aby = by - ay;
      const tt = Math.max(0, Math.min(1, ((x - ax) * abx + (y - ay) * aby) / (abx * abx + aby * aby)));
      const px = ax + abx * tt - x, py = ay + aby * tt - y;
      if (px * px + py * py < 36) n++;
    }
    return n;
  }

  function nearSegment(o, x, y, r) {
    const dx = Math.cos(o.a) * o.len / 2, dy = Math.sin(o.a) * o.len / 2;
    const ax = o.x - dx, ay = o.y - dy, abx = 2 * dx, aby = 2 * dy;
    const tt = Math.max(0, Math.min(1, ((x - ax) * abx + (y - ay) * aby) / (abx * abx + aby * aby)));
    return Math.hypot(ax + abx * tt - x, ay + aby * tt - y) < r;
  }

  // ---------- input ----------
  let down = null;
  canvas.addEventListener('pointerdown', e => {
    if (!playing) return;
    canvas.setPointerCapture(e.pointerId);
    const r = canvas.getBoundingClientRect();
    down = { x: e.clientX - r.left, y: e.clientY - r.top, lx: e.clientX - r.left, ly: e.clientY - r.top, moved: 0, t: performance.now() };
  });
  canvas.addEventListener('pointermove', e => {
    if (!down || !playing) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const dx = x - down.lx, dy = y - down.ly;
    down.moved += Math.hypot(dx, dy);
    if (Math.hypot(dx, dy) > 1) sweep(x, y, dx, dy);
    down.lx = x; down.ly = y;
  });
  canvas.addEventListener('pointerup', e => {
    if (!down || !playing) { down = null; return; }
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const isTap = down.moved < 10 && performance.now() - down.t < 400;
    down = null;
    if (isTap) tap(x, y);
  });
  canvas.addEventListener('pointercancel', () => { down = null; });

  function tap(x, y) {
    if (nearSegment(needle, x, y, TAP_RADIUS)) {
      const cover = coverAt(needle.x, needle.y);
      if (cover <= 3) return win();
      say('Da glitzert was … aber da liegt noch zu viel Heu drauf!', 'shake');
      return;
    }
    const nail = nails.find(n => nearSegment(n, x, y, TAP_RADIUS) && coverAt(n.x, n.y) <= 4);
    if (nail) {
      timeLeft = Math.max(0, timeLeft - 3);
      updateTime();
      say(pick(['Autsch! Das ist ein rostiger Nagel!', 'Nee, nur ein alter Nagel. −3 Sekunden!', 'Rostig! Meine Nadel ist silbern.']), 'shake', 'farmer-sad');
      return;
    }
    // a tap on plain hay also nudges it
    sweep(x, y, rand(-1, 1), -1);
  }

  // ---------- game flow ----------
  let sayTimer = 0;
  function say(text, anim, face = 'farmer') {
    speechEl.textContent = text;
    farmerEl.querySelector('use').setAttribute('href', '#' + face);
    if (anim && !reduceMotion) {
      farmerEl.classList.remove('bounce', 'shake');
      void farmerEl.getBoundingClientRect();
      farmerEl.classList.add(anim);
    }
    clearTimeout(sayTimer);
    if (face !== 'farmer') sayTimer = setTimeout(() => farmerEl.querySelector('use').setAttribute('href', '#farmer'), 1400);
  }
  const pick = a => a[(Math.random() * a.length) | 0];

  function updateTime() {
    timeEl.textContent = Math.ceil(timeLeft);
    timeChip.classList.toggle('low', timeLeft <= 5);
  }
  function updateHint() {
    hintBtn.textContent = `Magnet 🧲 ${hints}`;
    hintBtn.disabled = !playing || hints <= 0;
  }

  function showCard(html) {
    card.innerHTML = html;
    overlay.hidden = false;
    const btn = card.querySelector('.go');
    if (btn) { btn.addEventListener('click', btnAction); btn.focus(); }
  }
  let btnAction = () => {};

  function start() {
    overlay.hidden = true;
    setupLevel();
    playing = true;
    updateHint();
    say(level === 1 ? 'Wisch das Heu weg und tipp auf die silberne Nadel!' : pick([
      'Noch mehr Heu! Die Nadel ist wieder weg …',
      'Oh nein, schon wieder verloren!',
      'Diesmal liegen auch Nägel drin. Pass auf!'
    ]));
  }

  function win() {
    playing = false;
    needle.found = true;
    for (let i = 0; i < 24; i++) {
      sparkles.push({ x: needle.x, y: needle.y, vx: rand(-220, 220), vy: rand(-320, -60), r: rand(4, 9), life: 1 });
    }
    say(pick(['Meine Nadel! Danke!', 'Juhu, gefunden!', 'Du hast Adleraugen!']), 'bounce', 'farmer-wow');
    if (level > best) { best = level; try { localStorage.setItem('heuhaufen-best', String(best)); } catch (e) {} }
    updateHint();
    setTimeout(() => {
      btnAction = () => { level++; start(); };
      showCard(`
        <svg class="big"><use href="#farmer-wow"/></svg>
        <h1>Gefunden!</h1>
        <p>Level ${level} geschafft, mit ${Math.ceil(timeLeft)} Sekunden übrig.</p>
        <button class="go" type="button">Nächster Haufen</button>`);
    }, 900);
  }

  function lose() {
    playing = false;
    updateHint();
    say('Zu spät! Die Nadel bleibt im Heu …', 'shake', 'farmer-sad');
    // reveal: blow the hay away from the needle
    sweep(needle.x, needle.y, 0, -1);
    for (const s of straws) {
      const dx = s.x - needle.x, dy = s.y - needle.y, d = Math.hypot(dx, dy) || 1;
      if (d < 90) { s.vx += dx / d * 600; s.vy += dy / d * 600; }
    }
    setTimeout(() => {
      btnAction = () => { level = 1; start(); };
      showCard(`
        <svg class="big"><use href="#farmer-sad"/></svg>
        <h1>Zeit um!</h1>
        <p>Du bist bis Level <b>${level}</b> gekommen.<br>Rekord: Level ${best}.</p>
        <button class="go" type="button">Nochmal</button>`);
    }, 1400);
  }

  hintBtn.addEventListener('click', () => {
    if (!playing || hints <= 0) return;
    hints--;
    magnetUntil = performance.now() + 2500;
    // the magnet tugs straws off the needle a little
    for (const s of straws) {
      const dx = s.x - needle.x, dy = s.y - needle.y, d = Math.hypot(dx, dy) || 1;
      if (d < 40) { s.vx += dx / d * 260; s.vy += dy / d * 260; }
    }
    say('Der Magnet zieht … irgendwo hier in der Nähe!', 'bounce');
    updateHint();
  });

  document.getElementById('start').addEventListener('click', start);
  if (best > 0) {
    const bl = document.getElementById('bestLine');
    bl.textContent = `Dein Rekord: Level ${best}`;
    bl.hidden = false;
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (playing) {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; updateTime(); lose(); }
      else if (Math.ceil(timeLeft) !== Number(timeEl.textContent)) updateTime();
    }
    step(dt);
    draw(t);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => {
    const oldW = W, oldH = H;
    resize();
    // keep the pile anchored when the screen changes size
    const sx = W / (oldW || W), sy = H / (oldH || H);
    if (sx !== 1 || sy !== 1) {
      [...straws, ...nails, needle].forEach(o => { if (o) { o.x *= sx; o.y *= sy; } });
    }
  });

  resize();
  setupLevel();   // show a filled haystack behind the start card
  requestAnimationFrame(frame);
})();
</script>
