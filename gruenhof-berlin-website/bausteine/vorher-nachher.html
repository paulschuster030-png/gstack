<!--
  Vorher/Nachher-Schieber – ausgebauter Baustein
  ==============================================

  Warum er nicht auf der Seite ist
  --------------------------------
  Die Technik funktioniert einwandfrei: Ziehen mit Maus und Finger überall auf
  dem Bild, Pfeiltasten, Home/End, Screenreader-Rolle "slider" mit Wertansage.
  Was fehlte, war der Inhalt. Die beiden Ansichten waren gezeichnet – 40
  Vektorformen, kein einziges Foto. Ein Vorher/Nachher-Vergleich wirkt aber
  genau deshalb, weil er Beweis ist: "das habe ich wirklich gemacht". Eine
  Zeichnung ist an dieser Stelle Dekoration in der Form eines Beweises, und die
  Überschrift versprach mit "in einem Termin" obendrein etwas, das die
  Zeichnung nicht belegen konnte.

  Wie er zurückkommt
  ------------------
  1. Zwei echte Fotos machen: vor der Arbeit eines, danach eines aus demselben
     Winkel, gleiche Höhe, gleicher Ausschnitt. Querformat, mindestens 1600 px
     breit. Gleiche Tageszeit hilft, ist aber kein Muss.
  2. Beide als <img class="tf-img"> in die Szene setzen – das Nachher-Bild
     zusätzlich mit class="tf-after", denn dieses wird vom Regler beschnitten.
     Reihenfolge im Markup: erst Vorher, dann Nachher.
  3. Die drei Blöcke unten wieder einsetzen: das Markup in <main> (gut passt es
     zwischen "Leistungen" und "Wählen Sie einen Startpunkt"), das CSS zu den
     übrigen Regeln, das Skript in den vorhandenen <script>-Block.
  4. Die Überschrift auf das schreiben, was auf den Fotos wirklich zu sehen ist –
     und nur die Zeitangabe nennen, die der Auftrag wirklich gebraucht hat.

  Das JavaScript sichert sich selbst ab (es steigt aus, wenn Szene oder Griff
  fehlen), es kann also gefahrlos vor dem Markup im Dokument stehen.
-->

<!-- ==== 2. CSS ==== -->
<style>
.tf-demo{background:#101813;padding:0;display:grid;place-items:center;overflow:hidden}
.tf-demo__scene{position:relative;width:min(100%,1240px);aspect-ratio:12/7;transform:scale(1.02)}
.tf-demo__scene .tf-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tf-demo__scene .tf-after{clip-path:inset(0 calc((1 - var(--p,0)) * 100%) 0 0)}
.tf-demo__handle{position:absolute;top:0;bottom:0;left:calc(var(--p,0) * 100%);width:3px;background:rgba(255,255,255,.92);box-shadow:0 0 20px rgba(0,0,0,.35);transform:translateX(-1.5px);cursor:ew-resize;touch-action:none}
.tf-demo__handle span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:var(--shadow-md);display:grid;place-items:center;color:var(--brand-dark)}
.tf-demo__handle:focus-visible span{outline:3px solid #fff;outline-offset:3px}
.tf-demo__tags{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;font-family:var(--font-display);font-size:clamp(.86rem,2.6vw,1.2rem);color:#fff;pointer-events:none}
.tf-demo__tags span{background:rgba(12,20,15,.58);padding:.22em .8em;border-radius:var(--radius-pill)}
.tf-demo__intro{position:absolute;left:50%;top:6%;transform:translateX(-50%);width:min(92%,780px);text-align:center;color:#fff;padding:1rem 1.4rem;border-radius:var(--radius-lg);background:linear-gradient(180deg,rgba(12,20,15,.62),rgba(12,20,15,.3));text-shadow:0 2px 12px rgba(0,0,0,.55);pointer-events:none}
.tf-demo__intro .eyebrow{color:var(--accent-soft);justify-content:center}.tf-demo__intro .eyebrow::before{background:var(--accent-soft)}
.tf-demo__intro h2{color:#fff;margin:.4rem 0 .2rem}
.tf-demo__handle::after{content:"";position:absolute;top:50%;left:50%;width:48px;height:48px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 0 rgba(255,255,255,.55);animation:handlePulse 2s ease-out 1s 3;pointer-events:none}
@media(max-width:720px){.tf-demo__scene{aspect-ratio:auto;height:66svh}}
@keyframes handlePulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 24px rgba(255,255,255,0)}}
/* Bei „Bewegung reduzieren“ gehörte zusätzlich in die vorhandene Media-Query: */
/* .tf-demo__handle::after{animation:none} */
</style>

<!-- ==== 3. JavaScript ==== -->
<script>
(function () {
    var scene = document.querySelector('.tf-demo__scene');
    var handle = document.querySelector('.tf-demo__handle');
    if (!scene || !handle) return;
    var dragging = false;

    function currentP() {
      var v = parseFloat(scene.style.getPropertyValue('--p'));
      return isNaN(v) ? 0.55 : v;
    }
    function setP(p) {
      p = Math.min(1, Math.max(0, p));
      scene.style.setProperty('--p', p.toFixed(3));
      handle.setAttribute('aria-valuenow', String(Math.round(p * 100)));
    }
    function pFromEvent(clientX) {
      var rect = scene.getBoundingClientRect();
      return (clientX - rect.left) / rect.width;
    }

    handle.setAttribute('role', 'slider');
    handle.setAttribute('tabindex', '0');
    handle.setAttribute('aria-label', 'Vorher/Nachher-Vergleich verschieben');
    handle.setAttribute('aria-valuemin', '0');
    handle.setAttribute('aria-valuemax', '100');
    handle.setAttribute('aria-valuenow', String(Math.round(currentP() * 100)));

    handle.addEventListener('pointerdown', function (e) {
      dragging = true;
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      setP(pFromEvent(e.clientX));
    });
    handle.addEventListener('pointerup', function () { dragging = false; });
    handle.addEventListener('pointercancel', function () { dragging = false; });
    scene.addEventListener('pointerdown', function (e) {
      if (e.target === handle || handle.contains(e.target)) return;
      setP(pFromEvent(e.clientX));
      dragging = true;
      try { scene.setPointerCapture(e.pointerId); } catch (err) { /* ältere Browser */ }
      e.preventDefault();
    });
    scene.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      setP(pFromEvent(e.clientX));
    });
    scene.addEventListener('pointerup', function () { dragging = false; });
    scene.addEventListener('pointercancel', function () { dragging = false; });
    handle.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { setP(currentP() - 0.05); e.preventDefault(); }
      if (e.key === 'ArrowRight') { setP(currentP() + 0.05); e.preventDefault(); }
      if (e.key === 'Home') { setP(0); e.preventDefault(); }
      if (e.key === 'End') { setP(1); e.preventDefault(); }
    });
  })();
</script>
